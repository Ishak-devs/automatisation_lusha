<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radar — Dashboard Lusha</title>
<script src="/vendor/chart.umd.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
  *{box-sizing:border-box;}
  :root{
    --orange: #FF7300;
    --black: #000000;
    --white: #FFFFFF;
    --purple: #7065A1;
    --blue: #67B1EB;
    --yellow: #F9B125;
    --green: #65BF92;
    --rust: #E26338;
    --grey-100: #F5F5F5;
    --grey-200: #E0E0E0;
    --grey-600: #757575;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --font: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  body{
    margin:0; background:var(--grey-100); color:var(--black);
    font-family:var(--font); min-height:100vh;
  }

  /* HEADER — style page-header de la charte */
  header{
    background:var(--black); color:#fff;
    padding:36px 40px; border-radius:var(--radius);
    margin:24px 24px 20px; position:relative; overflow:hidden;
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px;
  }
  header::before{
    content:''; position:absolute; top:-60px; right:-60px;
    width:260px; height:260px; background:var(--orange); border-radius:50%; opacity:0.15;
  }
  header::after{
    content:''; position:absolute; bottom:-70px; right:100px;
    width:170px; height:170px; background:var(--purple); border-radius:50%; opacity:0.2;
  }
  .kicker{
    font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--orange); margin-bottom:10px; position:relative; z-index:1;
  }
  h1{
    font-family:var(--font); font-weight:700; font-size:28px; margin:0;
    position:relative; z-index:1; letter-spacing:0.01em;
  }
  .status{
    font-size:12px; color:rgba(255,255,255,0.6); text-align:right; position:relative; z-index:1;
  }
  .status b{color:#fff;}
  button{
    font-family:var(--font); font-size:14px; font-weight:700; background:var(--orange); color:#fff;
    border:2px solid transparent; padding:12px 24px; border-radius:8px; cursor:pointer;
    transition:all 0.15s; position:relative; z-index:1;
  }
  button:hover{opacity:0.85; transform:translateY(-1px);}
  button:disabled{opacity:0.5; cursor:wait; transform:none;}

  main{padding:0 24px 60px; max-width:1400px; margin:0 auto;}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:20px;}
  .kpi{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px;}
  .kpi .n{font-weight:700; font-size:30px; line-height:1;}
  .kpi .l{color:var(--grey-600); font-size:12px; margin-top:8px; text-transform:uppercase; letter-spacing:0.06em; font-weight:700;}

  .grid{display:grid; grid-template-columns:1.2fr 1fr; gap:16px; margin-bottom:16px;}
  @media(max-width:900px){.grid{grid-template-columns:1fr;}}

  .card{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:28px;}
  .card + .card{margin-top:0;}
  .card h2{
    font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--grey-600);
    margin:0 0 18px; font-weight:700;
  }
  .card canvas{max-height:280px;}

  .empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:80px 20px; color:var(--grey-600); text-align:center; gap:14px;
    background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
  }
  .empty .kicker{color:var(--orange);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--grey-200);}
  th{color:var(--grey-600); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;}

  .tag{
    display:inline-flex; align-items:center; gap:6px; padding:4px 12px;
    border-radius:20px; font-size:12px; font-weight:700;
  }
  .tag-orange{background:rgba(255,115,0,0.12); color:var(--orange);}
  .tag-purple{background:rgba(112,101,161,0.12); color:var(--purple);}
  .tag-blue{background:rgba(103,177,235,0.15); color:#3a8ece;}
  .tag-green{background:rgba(101,191,146,0.15); color:#2e8a5f;}
  .tag-yellow{background:rgba(249,177,37,0.15); color:#b07a00;}
</style>
</head>
<body>

<header>
  <div>
    <div class="kicker">Radar — pipeline commercial</div>
    <h1>Dashboard - Lusha</h1>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <div class="status" id="status">dernière sync : —</div>
    <button id="syncBtn">Lancer la sync</button>
  </div>
</header>

<main id="main">
  <div class="empty">
    <div class="kicker">Chargement</div>
    <div>Récupération des données...</div>
  </div>
</main>

<script>
const $ = (s,el=document) => el.querySelector(s);
const colors = {
  orange:'#FF7300', purple:'#7065A1', blue:'#67B1EB',
  yellow:'#F9B125', green:'#65BF92', rust:'#E26338', grey:'#E0E0E0'
};
let charts = [];

function destroyCharts(){ charts.forEach(c=>c.destroy()); charts = []; }

function countBy(arr, fn){
  const map = {};
  arr.forEach(item=>{
    const k = fn(item) || 'Inconnu';
    map[k] = (map[k]||0)+1;
  });
  return map;
}

function renderKPIs(db){
  return `
  <div class="kpis">
    <div class="kpi"><div class="n" style="color:${colors.orange}">${db.contacts?.length||0}</div><div class="l">Contacts</div></div>
    <div class="kpi"><div class="n" style="color:${colors.purple}">${db.companies?.length||0}</div><div class="l">Entreprises</div></div>
    <div class="kpi"><div class="n" style="color:${colors.rust}">${db.lastSync ? new Date(db.lastSync).toLocaleDateString('fr-FR') : '—'}</div><div class="l">Dernière sync</div></div>
  </div>`;
}

function makeBarChart(ctx, labels, data, color){
  return new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets:[{ data, backgroundColor: color, borderRadius:6, maxBarThickness:34 }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#757575', font:{family:'Roboto', size:11}}, grid:{display:false}},
        y:{ticks:{color:'#757575', font:{family:'Roboto', size:11}}, grid:{color:'#E0E0E0'}, beginAtZero:true}
      }
    }
  });
}

function makeDonut(ctx, labels, data, colorsArr){
  return new Chart(ctx, {
    type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor: colorsArr, borderColor:'#fff', borderWidth:2 }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom', labels:{color:'#000', font:{family:'Roboto', size:11}, boxWidth:10}}}
    }
  });
}

function signalTag(type){
  const t = (type||'').toLowerCase();
  if(t.includes('hir') || t.includes('headcount')) return '<span class="tag tag-green">hiring</span>';
  if(t.includes('news') || t.includes('strategy') || t.includes('financial')) return '<span class="tag tag-purple">news</span>';
  return '<span class="tag tag-blue">changement</span>';
}

async function render(){
  const res = await fetch('/api/data');
  const db = await res.json();
  $('#status').innerHTML = db.lastSync ? `dernière sync : <b>${new Date(db.lastSync).toLocaleString('fr-FR')}</b>` : 'dernière sync : <b>jamais</b>';

  const hasData = (db.contacts?.length||0) + (db.companies?.length||0) > 0;
  destroyCharts();

  if(!hasData){
    $('#main').innerHTML = `<div class="empty">
      <div class="kicker">Aucune donnée</div>
      <div>Rien à afficher pour l'instant.<br/>Configurez LUSHA_API_KEY côté serveur puis lancez une sync.</div>
    </div>`;
    return;
  }

  const seniorityCount = countBy(db.contacts||[], c => c.jobTitle?.seniority || c.jobTitle?.title);
  const industryCount = countBy(db.companies||[], c => c.industry);
  const allSignals = [...(db.companySignals||[]), ...(db.contactSignals||[])];
  const hasSignals = allSignals.length > 0;
  const signalTypeCount = countBy(allSignals, s => s.type || s.signalType);
  const sizeCount = countBy(db.companies||[], c => {
    const e = c.employeeCount;
    if(!e) return 'Inconnu';
    if(e.exact) return `${e.exact} employés`;
    if(e.min || e.max) return `${e.min||'?'}–${e.max||'?'}`;
    return 'Inconnu';
  });

  $('#main').innerHTML = renderKPIs(db) + `
  <div class="grid">
    <div class="card">
      <h2>Contacts par séniorité</h2>
      <canvas id="c1"></canvas>
    </div>
    <div class="card">
      <h2>Entreprises par industrie</h2>
      <canvas id="c3"></canvas>
    </div>
  </div>
  <div class="card">
    <h2>Entreprises par taille</h2>
    <canvas id="c4"></canvas>
  </div>
  ${hasSignals ? `
  <div class="card" style="margin-top:16px;">
    <h2>Répartition des signaux</h2>
    <canvas id="c2"></canvas>
  </div>
  <div class="card" style="margin-top:16px;">
    <h2>Derniers signaux</h2>
    <table>
      <thead><tr><th>Type</th><th>Cible</th><th>Détail</th></tr></thead>
      <tbody>
        ${allSignals.slice(0,10).map(s => `
          <tr>
            <td>${signalTag(s.type || s.signalType)}</td>
            <td>${s.data?.currentCompanyName || s.data?.companyName || s.companyName || '—'}</td>
            <td style="color:var(--grey-600)">${(s.data?.eventSummary || s.data?.articleTitle || s.type || JSON.stringify(s).slice(0,60))}</td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>` : ''}
  `;

  charts.push(makeBarChart($('#c1'), Object.keys(seniorityCount), Object.values(seniorityCount), colors.orange));
  charts.push(makeBarChart($('#c3'), Object.keys(industryCount), Object.values(industryCount), colors.purple));
  charts.push(makeBarChart($('#c4'), Object.keys(sizeCount), Object.values(sizeCount), colors.yellow));
  if(hasSignals){
    charts.push(makeDonut($('#c2'), Object.keys(signalTypeCount), Object.values(signalTypeCount), [colors.orange,colors.purple,colors.blue,colors.green,colors.yellow,colors.rust]));
  }
}

$('#syncBtn').addEventListener('click', async () => {
  const btn = $('#syncBtn');
  btn.disabled = true; btn.textContent = 'Sync en cours...';
  try{
    const r = await fetch('/api/sync', {method:'POST'});
    const j = await r.json();
    if(!j.ok) throw new Error(JSON.stringify(j.error));
    await render();
  }catch(e){
    alert('Erreur sync: ' + e.message);
  }finally{
    btn.disabled = false; btn.textContent = 'Lancer la sync';
  }
});

render();
</script>
</body>
</html>
